name: labs
on:
  workflow_dispatch:
  push:
    paths: ['tests/**','labs/**','.github/workflows/**']
permissions:
  contents: write
jobs:
  l78:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests\run78.cmd > res_l78.txt 2>&1
        shell: cmd
        continue-on-error: true
      - if: always()
        shell: bash
        run: |
          cp res_l78.txt /tmp/res.txt
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan results-l78
          git rm -rf . -q
          cp /tmp/res.txt res.txt
          git add res.txt
          git commit -qm "results l78"
          git push -f origin results-l78
